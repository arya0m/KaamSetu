name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Audits exactly what ships in the image (the hash-pinned runtime lock).
      - run: pip-audit --strict --require-hashes --disable-pip -r requirements.lock

  test:
    name: Tests (Postgres + pgvector, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kaamsetu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d kaamsetu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI-only service credentials, not secrets.
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/kaamsetu_test
      TEST_REDIS_URL: redis://localhost:6379/0
      # Missing services make db tests fail instead of silently skipping.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80

  compose:
    name: docker compose up smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with a random password
        run: |
          cp .env.example .env
          sed -i "s/change-me/$(openssl rand -hex 16)/g" .env
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: /readyz is green
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/readyz && exit 0
            sleep 2
          done
          exit 1
      - name: Task round-trips through Redis to the worker
        run: |
          docker compose exec -T api python -c "from app.workers.tasks import ping; ping.delay()"
          for i in $(seq 1 30); do
            docker compose logs worker | grep -q "succeeded.*'pong'" && exit 0
            sleep 2
          done
          exit 1
      - name: API shuts down gracefully (SIGTERM reaches uvicorn)
        run: |
          start=$(date +%s)
          docker compose stop -t 30 api
          elapsed=$(( $(date +%s) - start ))
          echo "api stopped in ${elapsed}s"
          test "$elapsed" -lt 10
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
